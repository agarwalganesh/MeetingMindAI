version: '3.8'

services:
  backend:
    build: ./backend
    container_name: meetingmind_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///../database/meetingmind.db
      - SECRET_KEY=supersecretjwtkeyformeetingmindai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_chromadb:/app/chromadb
      - backend_database:/app/database

  frontend:
    build: ./frontend
    container_name: meetingmind_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_reports:
  backend_chromadb:
  backend_database:
